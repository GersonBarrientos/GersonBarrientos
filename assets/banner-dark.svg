<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Gerson Barrientos</title>
  <desc id="desc">Banner profesional de Gerson Barrientos, ubicado en Texistepeque, Santa Ana, El Salvador.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#background)"/>
  <circle cx="1080" cy="30" r="220" fill="#2DD4BF" opacity=".12" filter="url(#glow)"/>
  <circle cx="260" cy="430" r="230" fill="#818CF8" opacity=".12" filter="url(#glow)"/>
  <path d="M0 350 C260 275 360 410 640 330 S1030 250 1280 320" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>
  <rect x="82" y="72" width="84" height="6" rx="3" fill="url(#accent)"/>
  <text x="82" y="166" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700">Gerson Barrientos</text>
  <text x="86" y="218" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="28">Texistepeque · Santa Ana · El Salvador</text>
  <text x="86" y="278" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="19">Comprometido con crear y mejorar productos de software.</text>
  <g fill="#CBD5E1" font-family="monospace" font-size="17">
    <text x="86" y="350">Backend</text>
    <text x="205" y="350">·</text>
    <text x="227" y="350">Frontend</text>
    <text x="365" y="350">·</text>
    <text x="387" y="350">Metodologías ágiles</text>
  </g>
  <circle cx="1120" cy="210" r="92" fill="none" stroke="url(#accent)" stroke-opacity=".7" stroke-width="2"/>
  <circle cx="1120" cy="210" r="64" fill="none" stroke="#2DD4BF" stroke-opacity=".25" stroke-width="1"/>
  <path d="M1086 210h68M1120 176v68" stroke="#E2E8F0" stroke-opacity=".45" stroke-width="2"/>
</svg>
