<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Gerson Barrientos</title>
  <desc id="desc">Banner animado de Gerson Barrientos, de Texistepeque, Santa Ana, El Salvador.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4F46E5" stop-opacity=".14"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0D9488" stop-opacity=".14"/>
      <stop offset="1" stop-color="#0D9488" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#D0D7DE" stroke-opacity=".55"/>
    </pattern>
    <clipPath id="card">
      <rect width="1280" height="420" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="#FFFFFF"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <circle cx="1120" cy="380" r="340" fill="url(#glow)"/>
    <circle cx="120" cy="20" r="300" fill="url(#glow2)"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="419" rx="18" fill="none" stroke="#D0D7DE"/>

  <text x="72" y="108" font-family="monospace" font-size="18" fill="#0D9488">// hola, mundo</text>
  <text x="72" y="196" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="-2" fill="url(#accent)">Gerson Barrientos</text>
  <text x="72" y="244" font-family="monospace" font-size="22" fill="#57606A">Texistepeque  /  Santa Ana  /  El Salvador</text>

  <rect x="72" y="278" width="318" height="42" rx="21" fill="#FFFFFF" stroke="#D0D7DE"/>
  <circle cx="98" cy="299" r="5" fill="#34D399">
    <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="120" y="305" font-family="monospace" font-size="16" fill="#0B0F14">Abierto a oportunidades</text>
  <text x="72" y="372" font-family="monospace" font-size="15" fill="#57606A">github.com/GersonBarrientos</text>

  <g>
    <rect x="720" y="62" width="488" height="296" rx="14" fill="#FFFFFF" stroke="#D0D7DE"/>
    <circle cx="748" cy="90" r="6" fill="#FF5F56"/>
    <circle cx="768" cy="90" r="6" fill="#FFBD2E"/>
    <circle cx="788" cy="90" r="6" fill="#27C93F"/>
    <text x="964" y="95" text-anchor="middle" font-family="monospace" font-size="13" fill="#57606A">yo.ts</text>
    <line x1="720" y1="114" x2="1208" y2="114" stroke="#D0D7DE"/>
    <g font-family="monospace" font-size="18" fill="#0B0F14" xml:space="preserve">
      <text x="748" y="152" opacity="0"><tspan fill="#4F46E5">const</tspan> yo = {<animate attributeName="opacity" from="0" to="1" begin=".3s" dur=".3s" fill="freeze"/></text>
      <text x="748" y="184" opacity="0">  nombre: <tspan fill="#0D9488">"Gerson"</tspan>,<animate attributeName="opacity" from="0" to="1" begin=".7s" dur=".3s" fill="freeze"/></text>
      <text x="748" y="216" opacity="0">  ubicacion: <tspan fill="#0D9488">"El Salvador"</tspan>,<animate attributeName="opacity" from="0" to="1" begin="1.1s" dur=".3s" fill="freeze"/></text>
      <text x="748" y="248" opacity="0">  backend: <tspan fill="#B45309">true</tspan>,<animate attributeName="opacity" from="0" to="1" begin="1.5s" dur=".3s" fill="freeze"/></text>
      <text x="748" y="280" opacity="0">  frontend: <tspan fill="#B45309">true</tspan>,<animate attributeName="opacity" from="0" to="1" begin="1.9s" dur=".3s" fill="freeze"/></text>
      <text x="748" y="312" opacity="0">};<animate attributeName="opacity" from="0" to="1" begin="2.3s" dur=".3s" fill="freeze"/></text>
    </g>
    <rect x="775" y="297" width="11" height="20" fill="#0D9488" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.01;.5;.51;1" dur="1.1s" begin="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
